name: 'Accessibility Audit'
description: 'Reviews frontend code in PRs for accessibility issues — missing labels, ARIA attributes, keyboard navigation, color contrast, and heading hierarchy.'
category: 'Code Quality'
icon: 'eye'
triggerType: 'event'
triggerConfig:
  events:
    - 'pull_request.opened'
    - 'pull_request.synchronize'
promptTemplate: |
  Review pull request #{{event.number}} in {{event.repo}} for accessibility (a11y) issues.

  **PR title:** {{event.title}}

  ## Accessibility review

  Get the full diff with `gh pr diff {{event.number}}`. Focus on files containing UI code (`.tsx`, `.jsx`, `.vue`, `.svelte`, `.html`, `.erb`, `.blade.php`). If the PR has no frontend changes, leave a brief comment and stop.

  ### 1. Images and media
  - **Missing alt text** — every `<img>` must have an `alt` attribute. Decorative images should use `alt=""`; meaningful images need descriptive alt text
  - **Icon-only buttons** — buttons or links with only an icon and no visible text need `aria-label` or `aria-labelledby`
  - **Videos without captions** — `<video>` elements should have captions or a text alternative

  ### 2. Forms and inputs
  - **Missing labels** — every form input (`<input>`, `<select>`, `<textarea>`) must have an associated `<label>` via `htmlFor`/`id` or wrapping
  - **Missing error descriptions** — form validation errors should be linked to their input via `aria-describedby`
  - **Missing required indicators** — required fields should have `aria-required="true"` or `required` attribute
  - **Autocomplete** — login forms should use appropriate `autocomplete` attributes (`username`, `current-password`, `email`)

  ### 3. Keyboard navigation
  - **Click handlers without keyboard** — elements with `onClick` that aren't buttons or links need `onKeyDown`/`onKeyUp` handlers and `tabIndex`
  - **Focus management** — modals, dialogs, and popovers should trap focus and return it when closed
  - **Focus visibility** — custom focus styles should be visible. Check for `outline: none` without a replacement
  - **Skip links** — long pages should have a "Skip to main content" link (check on new pages/layouts)

  ### 4. Semantic HTML
  - **Heading hierarchy** — headings should follow a logical order (h1 → h2 → h3). Don't skip levels
  - **Landmark regions** — pages should use `<main>`, `<nav>`, `<header>`, `<footer>`, `<aside>` appropriately
  - **Lists** — groups of related items should use `<ul>`/`<ol>` and `<li>`, not `<div>` chains
  - **Buttons vs links** — `<button>` for actions, `<a>` for navigation. Never use `<div onClick>` as a button

  ### 5. ARIA usage
  - **ARIA roles** — check for correct role usage. Common mistakes: `role="button"` on a `<div>` instead of using `<button>`, redundant roles on semantic elements
  - **Dynamic content** — content that updates without page reload should use `aria-live` regions
  - **Expandable sections** — accordions and dropdowns need `aria-expanded`, `aria-controls`
  - **No ARIA is better than bad ARIA** — flag incorrect ARIA usage that makes things worse for screen readers

  ### 6. Color and contrast
  - **Color as sole indicator** — information conveyed only through color (e.g., red = error) needs an additional indicator (icon, text)
  - **Contrast concerns** — flag very light text on light backgrounds or dark text on dark backgrounds. Look for hardcoded color values with potentially low contrast ratios

  ## Output format

  Write your review to a file, then post a **comment on the PR** using `gh pr comment {{event.number}} --body-file <file>` with findings for each issue:
  - Reference the specific element, file, and line
  - Explain the accessibility impact (who is affected and how)
  - Suggest a specific fix with a code example
  - Rate: **violation** (WCAG failure, must fix), **warning** (best practice, should fix), **note** (enhancement)

  If no a11y issues are found, post a brief note confirming what was checked.
model: null
variables: []
