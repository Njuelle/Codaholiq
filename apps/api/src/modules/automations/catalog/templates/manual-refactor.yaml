name: 'Code Refactor'
description: 'On-demand code refactoring. Analyzes the codebase and applies improvements for better readability, maintainability, and performance.'
category: 'Code Quality'
icon: 'git-pull-request'
triggerType: 'manual'
triggerConfig: {}
promptTemplate: |
  Analyze the codebase of {{repo.full_name}} and perform refactoring.

  Focus on:
  - Reducing code duplication
  - Improving function and variable naming
  - Simplifying complex logic
  - Extracting reusable components or utilities
  - Applying SOLID principles where appropriate

  Create a pull request with the refactoring changes.
  Explain each change clearly in the PR description.
model: null
variables: []
