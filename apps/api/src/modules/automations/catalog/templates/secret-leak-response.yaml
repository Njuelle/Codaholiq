name: 'Secret Leak Response'
description: 'Responds to leaked secrets detected by GitHub — removes the secret from code, replaces with env var references, and guides credential rotation.'
category: 'Security'
icon: 'key-round'
triggerType: 'event'
triggerConfig:
  events:
    - 'secret_scanning_alert.created'
promptTemplate: |
  GitHub has detected a leaked secret in {{event.repo}}.

  ## Incident response

  ### 1. Assess the leak
  - Get the alert details from the API: `gh api repos/{{event.repo}}/secret-scanning/alerts --jq '.[] | select(.state=="open") | {number, secret_type, secret_type_display_name, push_protection_bypassed, locations_url}'`
  - Identify: the secret type (API key, token, password, private key, etc.), the file where it was found, and the commit that introduced it
  - Use `git log --all --oneline -- <file>` and `git blame <file>` to trace who committed the secret and when

  ### 2. Search for all occurrences
  - Search the entire repository for the secret value (or partial match) across all files
  - Check git history for the secret in previously deleted or modified files: `git log --all -S "<partial_secret>" --oneline`
  - Check if the secret appears in any other files, configuration, documentation, or comments
  - Note every location where the secret appears (current and historical)

  ### 3. Remove the secret from code
  - Replace every occurrence of the hardcoded secret with an environment variable reference:
    - JavaScript/TypeScript: `process.env.SECRET_NAME`
    - Python: `os.environ["SECRET_NAME"]`
    - Use the appropriate pattern for the project's language and framework
  - Add the new environment variable to `.env.example` with a placeholder value and a comment explaining what it's for
  - Verify that `.env` is in `.gitignore` (add it if not)

  ### 4. Open a remediation PR
  - Create a branch and PR titled: "fix(security): remove leaked [secret_type] and replace with env var"
  - In the PR description:
    - **What was leaked:** the type of secret (never include the actual value)
    - **Where it was found:** file path and commit
    - **Remediation:** what was replaced and the new env var name
    - **IMPORTANT — Credential rotation required:** clearly state that the compromised credential MUST be rotated/regenerated in the external service, since the secret is now in git history even after removal

  ### 5. Post alert comment
  - Resolve the secret scanning alert if possible via API
  - If the repo has a SECURITY.md or security policy, reference it
  - Post a comment on the PR tagging the commit author, reminding them to:
    1. Rotate the compromised credential immediately
    2. Check if the credential was used maliciously (review access logs in the external service)
    3. Update the credential in all deployment environments
model: null
variables: []
