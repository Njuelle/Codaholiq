# Codaholiq workflow template
# Add this file to any repository you want to automate with Codaholiq.
#
# Supported providers:
#   claude-code  — requires ANTHROPIC_API_KEY (+ optional CLAUDE_CODE_OAUTH_TOKEN)
#   codex        — requires OPENAI_API_KEY
#   gemini       — requires GEMINI_API_KEY
#   opencode     — requires the API key for the selected model's provider
#
# Set the required secrets under Settings > Secrets and variables > Actions.
name: Codaholiq

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'AI provider to use'
        required: true
        type: choice
        options:
          - claude-code
          - codex
          - gemini
          - opencode
        default: 'claude-code'
      prompt:
        description: 'The prompt to send to the AI provider'
        required: true
        type: string
      model:
        description: 'Model ID (optional — defaults to the provider default)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  security-events: read
  id-token: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Validate provider input
        run: |
          KNOWN="claude-code opencode codex gemini"
          if ! echo "$KNOWN" | grep -qw "$PROVIDER"; then
            echo "::error::Unknown provider: $PROVIDER (expected one of: $KNOWN)"
            exit 1
          fi
        env:
          PROVIDER: ${{ github.event.inputs.provider }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        if: hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml', 'bun.lockb') != ''
        shell: bash
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            npm install -g pnpm && pnpm install --frozen-lockfile
          elif [ -f "yarn.lock" ]; then
            corepack enable && yarn install --frozen-lockfile
          elif [ -f "bun.lockb" ]; then
            npm install -g bun && bun install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          fi

      # ── Claude Code ──────────────────────────────────────────────
      - name: Run Claude Code
        if: inputs.provider == 'claude-code'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ inputs.prompt }}
          allowed_bots: 'codaholiq'
          claude_args: >-
            --allowedTools "Bash" "Read" "Edit" "Write" "Glob" "Grep" "WebFetch" "Task"
            ${{ inputs.model != '' && format('--model "{0}"', inputs.model) || '' }}

      # ── OpenAI Codex ─────────────────────────────────────────────
      - name: Run OpenAI Codex
        if: inputs.provider == 'codex'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: ${{ inputs.prompt }}
          model: ${{ inputs.model }}
          sandbox: 'workspace-write'

      # ── Gemini CLI ───────────────────────────────────────────────
      - name: Run Gemini CLI
        if: inputs.provider == 'gemini'
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: ${{ inputs.prompt }}
          gemini_model: ${{ inputs.model }}

      # ── OpenCode ─────────────────────────────────────────────────
      - name: Run OpenCode
        if: inputs.provider == 'opencode'
        uses: anomalyco/opencode/github@latest
        with:
          model: ${{ inputs.model }}
          prompt: ${{ inputs.prompt }}
          use_github_token: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
