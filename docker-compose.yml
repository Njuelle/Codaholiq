services:
  postgres:
    image: postgres:16-alpine
    container_name: codaholiq-postgres
    environment:
      POSTGRES_USER: codaholiq
      POSTGRES_PASSWORD: codaholiq
      POSTGRES_DB: codaholiq
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codaholiq']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codaholiq-redis
    command: redis-server --requirepass codaholiq
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'codaholiq', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
